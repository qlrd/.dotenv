# ── terminal ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -sg extended-keys on
set -as terminal-features ',*:extkeys'
set -sg escape-time 0
set -g focus-events on

# ── general ──────────────────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g mouse on

# ── status bar ───────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-style "bg=#1E1E2E,fg=#CDD6F4"

set -g status-left-length 40
set -g status-left "#[bg=#89B4FA,fg=#1E1E2E,bold]  #S #[bg=#1E1E2E,fg=#89B4FA,nobold]"

set -g window-status-separator ""
set -g window-status-format         "#[bg=#1E1E2E,fg=#585B70]  #I #W  "
set -g window-status-current-format "#[bg=#1E1E2E,fg=#313244]#[bg=#313244,fg=#89B4FA,bold]  #I #W  #[bg=#1E1E2E,fg=#313244]"

set -g status-right-length 60
set -g status-right "#[bg=#1E1E2E,fg=#313244]#[bg=#313244,fg=#BAC2DE]  #h  #[bg=#313244,fg=#89B4FA] %H:%M  #[bg=#89B4FA,fg=#1E1E2E,bold] %d %b "

# ── pane borders ─────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#45475A"
set -g pane-active-border-style "fg=#89B4FA"
set -g pane-border-lines        single

# ── messages ─────────────────────────────────────────────────────────────────
set -g message-style         "bg=#313244,fg=#CDD6F4"
set -g message-command-style "bg=#313244,fg=#F9E2AF"

# ── selection/copy mode ───────────────────────────────────────────────────────
set -g mode-style "bg=#89B4FA,fg=#1E1E2E"
