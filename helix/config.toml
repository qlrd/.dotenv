
theme = "onedark_transparent"

[editor]
line-number = "absolute"
mouse = false
auto-completion=true
auto-save=true
auto-format=true
text-width=80
rulers = [80]
indent-heuristic = "simple"
editor-config = true
gutters = ["line-numbers", "diff", "diagnostics", "spacer"]
soft-wrap.enable = true
soft-wrap.max-indent-retain=80

[editor.file-picker]
hidden = false

[editor.statusline]
left = ["mode", "spinner", "file-modification-indicator", "read-only-indicator"]
center = ["file-name"]
right = ["diagnostics", "register", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "LOCKED"
mode.insert = "WORKING"
mode.select = "VISUAL SEL"

[editor.cursor-shape]
normal = "hidden"
insert = "bar"
select = "block"

[editor.lsp]
enable=true
auto-signature-help=true
display-messages = true
display-inlay-hints = true

[editor.smart-tab]
enable = false

[editor.indent-guides]
render = true
character = "┊"
skip-levels = 1

[keys.normal]
F2 = [
    "extend_line_below",
    ":pipe bash ~/.config/helix/scripts/docblock.sh"
]
F1 = [
    ":sh echo \"%{%}\" > ~/.cache/helix/file_path_absolute",
    "select_all",
    ":pipe python3 ~/.config/helix/scripts/42header_pipe.py \"$(cat ~/.cache/helix/file_path_absolute | tr -d '\\n')\""
]
# C-g: Git menu (lazygit-inspired)
# L = lazygit, a = add, A = amend, m = commit message, s = signoff, S = sign
# p = push, P = pull, b = branch, l = log, d = diff, D = diff staged, r = reset, R = rebase, t = stash, T = stash pop, f = fetch
# B = absorb (auto-fixup staged changes into prior commits)
C-g = { L = [
    ":sh echo \"%{%}\" > ~/.cache/helix/file_path_absolute",
    ":write-all",
    ":new",
    ":insert-output lazygit -p \"%sh{git -C ''%sh{dirname %sh{cat ~/.cache/helix/file_path_absolute}}'' rev-parse --show-toplevel}\"",
    ":buffer-close!",
    ":set mouse false",
    ":set mouse true",
    ":redraw",
    ":reload-all"
], a = [
    ":write-all",
    ":sh git add -A"
], A = [
    ":write-all",
    ":sh git commit --amend --no-edit"
], m = [
    ":write-all",
    ":sh git commit"
], s = [
    ":write-all",
    ":sh git commit --signoff"
], S = [
    ":write-all",
    ":sh git commit -S"
], p = [
    ":sh git push"
], P = [
    ":sh git pull"
], b = [
    ":new",
    ":insert-output git branch -a --color=never",
    ":set-option bufferline always"
], l = [
    ":new",
    ":insert-output git log --oneline -30"
], d = [
    ":new",
    ":insert-output git diff"
], D = [
    ":new",
    ":insert-output git diff --staged"
], r = [
    ":sh git checkout -- ."
], R = [
    ":sh git rebase --continue"
], t = [
    ":write-all",
    ":sh git stash"
], T = [
    ":sh git stash pop"
], f = [
    ":sh git fetch --all"
], B = [
    ":write-all",
    ":sh git absorb --and-rebase"
] }

[keys.insert]
A-ret = ["insert_newline", ":insert-output printf ' * '"]
